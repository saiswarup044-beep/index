<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Trishna ❤️</title>


<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle, #ff5f9e, #7209b7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
  }


  .card {
    background: white;
    padding: 35px;
    border-radius: 25px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    z-index: 2;
  }


  h1 {
    color: #e91e63;
    font-size: 32px;
  }


  p {
    font-size: 18px;
    margin: 14px 0;
    color: #333;
  }


  button {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin: 10px;
  }


  .yes {
    background: #e91e63;
    color: white;
  }


  .no {
    background: #ddd;
  }


  /* Floating Hearts */
  .heart {
    position: absolute;
    bottom: -20px;
    color: rgba(255,255,255,0.9);
    animation: floatUp linear infinite;
  }


  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120vh) scale(1.6); opacity: 0; }
  }


  /* Fireworks */
  .firework {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: explode 1s ease-out forwards;
  }


  @keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(5); opacity: 0; }
  }
</style>
</
